[project]
name = "ion-type-analysis"
version = "0.0.1"
description = "Short Description TODO"
authors = [{ name = "Adriano Rutz", email = "rutz@imsb.biol.ethz.ch" }]
license = "LICENSE"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["Mass Spectrometry", "Ion types", "In Source Fragmentation", "Open Science"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
    "Framework :: tox",
    "Framework :: Sphinx",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only"
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tqdm>=4.69.0",
]

[project.urls]
Homepage = "https://github.com/zamboni-lab/ion-type-analysis"
Repository = "https://github.com/zamboni-lab/ion-type-analysis"
Documentation = "https://github.com/zamboni-lab/ion-type-analysis"

[project.optional-dependencies]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-napoleon>=0.7",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.2",
    "flake8>=7.3.0",
    "importlib-metadata>=9.0.0",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "requests-mock>=1.12.1",
    "tox>=4.58.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
reverse_relative = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.doc8]
max-line-length = 120

[tool.flake8]
# check  .flake8

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
unfixable = [
    # do not autoremove commented out code
    "ERA",
]
extend-select = [
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-eradicate/eradicate
    "ERA",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-pie
    "PIE",
    # pygrep
    "PGH",
    # ruff checks
    "RUF",
    # flake8-simplify
    "SIM",
    # flake8-type-checking
    "TCH",
    # flake8-tidy-imports
    "TID",
    # pyupgrade
    "UP",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["poetry_plugin_export"]
required-imports = ["from __future__ import annotations"]

[tool.setuptools_scm]